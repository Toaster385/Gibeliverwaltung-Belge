name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Erkennung, Funktionen, und der Garantie-Test "bestehende Belege bleiben bei Updates erhalten"
      - run: npm test
