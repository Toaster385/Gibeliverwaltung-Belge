<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden – Ferienhaus Gibeli</title>
  <meta name="theme-color" content="#2F4A3A">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F4A3A'/%3E%3Cpath d='M3 26L13 8l4.5 7.5L21 10l8 16z' fill='%236FA3BF'/%3E%3Cpath d='M13 8l-3.4 6 2.4-1.4 1.6 1.9 1.6-1.7 2.4 1.2z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2F4A3A"/><path d="M3 26L13 8l4.5 7.5L21 10l8 16z" fill="#6FA3BF"/><path d="M13 8l-3.4 6 2.4-1.4 1.6 1.9 1.6-1.7 2.4 1.2z" fill="#fff"/></svg>
        <h1>Ferienhaus Gibeli</h1>
        <p>Belegverwaltung · <span style="white-space:nowrap">Achseten 1285&nbsp;m&nbsp;ü.&nbsp;M.</span></p>
        <p class="login-verein">TV Lorraine-Breitenrain Bern</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="benutzername">Benutzername</label>
          <input type="text" id="benutzername" class="input-field" placeholder="Dein Name" autocomplete="off">
        </div>
        <div class="form-group">
          <label id="pinLabel" for="pin1">PIN (4 Ziffern)</label>
          <div class="pin-row" role="group" aria-labelledby="pinLabel">
            <input type="password" id="pin1" class="input-field pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Ziffer 1">
            <input type="password" id="pin2" class="input-field pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Ziffer 2">
            <input type="password" id="pin3" class="input-field pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Ziffer 3">
            <input type="password" id="pin4" class="input-field pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Ziffer 4">
          </div>
        </div>

        <div class="error-msg hidden" id="errorMsg" role="alert"></div>

        <button type="button" class="btn-login" id="btnLogin">Anmelden</button>
      </form>

      <div class="admin-link">
        <a href="admin.html" class="btn-admin">Admin-Bereich</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('btnLogin').addEventListener('click', doLogin);

    // 4 einzelne Ziffernfelder: Auto-Weiter, Rückwärts mit Backspace, Einfügen, Enter
    var pinBoxes = [1, 2, 3, 4].map(function(i) { return document.getElementById('pin' + i); });
    pinBoxes.forEach(function(box, i) {
      box.addEventListener('input', function() {
        box.value = box.value.replace(/\D/g, '').slice(0, 1);
        if (box.value && i < 3) pinBoxes[i + 1].focus();
      });
      box.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { doLogin(); return; }
        if (e.key === 'Backspace' && !box.value && i > 0) { pinBoxes[i - 1].focus(); pinBoxes[i - 1].value = ''; }
        if (e.key === 'ArrowLeft' && i > 0) pinBoxes[i - 1].focus();
        if (e.key === 'ArrowRight' && i < 3) pinBoxes[i + 1].focus();
      });
      box.addEventListener('focus', function() { box.select(); });
      box.addEventListener('paste', function(e) {
        var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
        if (!text) return;
        e.preventDefault();
        text.split('').forEach(function(ch, k) { pinBoxes[k].value = ch; });
        pinBoxes[Math.min(text.length, 3)].focus();
      });
    });

    function doLogin() {
      var btn = document.getElementById('btnLogin');
      var errorMsg = document.getElementById('errorMsg');
      var benutzername = document.getElementById('benutzername').value.trim();
      var pin = pinBoxes.map(function(b) { return b.value; }).join('');

      errorMsg.classList.add('hidden');

      if (!benutzername || pin.length !== 4) {
        errorMsg.textContent = 'Bitte Benutzername und 4-stelligen PIN eingeben';
        errorMsg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Anmelden...';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/login', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        btn.disabled = false;
        btn.textContent = 'Anmelden';
        try {
          var data = JSON.parse(xhr.responseText);
          if (xhr.status !== 200) {
            errorMsg.textContent = data.error || 'Anmeldung fehlgeschlagen';
            errorMsg.classList.remove('hidden');
            pinBoxes.forEach(function(b) { b.value = ''; });
            pinBoxes[0].focus();
            return;
          }
          window.location.href = '/';
        } catch(e) {
          errorMsg.textContent = 'Fehler beim Anmelden';
          errorMsg.classList.remove('hidden');
        }
      };
      xhr.send(JSON.stringify({ benutzername: benutzername, pin: pin }));
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', function() { navigator.serviceWorker.register('/sw.js').catch(function() {}); });
  </script>
</body>
</html>
