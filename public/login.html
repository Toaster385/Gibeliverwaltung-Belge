<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden – Belegverwaltung</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <span>🧾</span>
        <h1>Belegverwaltung</h1>
        <p>Bitte melde dich an</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="benutzername">Benutzername</label>
          <input type="text" id="benutzername" class="input-field" placeholder="Dein Name" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="geburtsdatum">Geburtsdatum</label>
          <input type="date" id="geburtsdatum" class="input-field">
        </div>

        <div class="error-msg hidden" id="errorMsg"></div>

        <button type="button" class="btn-login" id="btnLogin">Anmelden</button>
      </form>

      <div class="admin-link">
        <a href="admin.html" class="btn-admin">⚙ Admin-Bereich</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('btnLogin').addEventListener('click', doLogin);
    document.getElementById('geburtsdatum').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    function doLogin() {
      var btn = document.getElementById('btnLogin');
      var errorMsg = document.getElementById('errorMsg');
      var benutzername = document.getElementById('benutzername').value.trim();
      var geburtsdatum = document.getElementById('geburtsdatum').value;

      errorMsg.classList.add('hidden');

      if (!benutzername || !geburtsdatum) {
        errorMsg.textContent = 'Bitte Benutzername und Geburtsdatum eingeben';
        errorMsg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Anmelden...';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/login', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        btn.disabled = false;
        btn.textContent = 'Anmelden';
        try {
          var data = JSON.parse(xhr.responseText);
          if (xhr.status !== 200) {
            errorMsg.textContent = data.error || 'Anmeldung fehlgeschlagen';
            errorMsg.classList.remove('hidden');
            return;
          }
          window.location.href = '/';
        } catch(e) {
          errorMsg.textContent = 'Fehler beim Anmelden';
          errorMsg.classList.remove('hidden');
        }
      };
      xhr.send(JSON.stringify({ benutzername: benutzername, geburtsdatum: geburtsdatum }));
    }
  </script>
</body>
</html>
